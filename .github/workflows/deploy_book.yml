name: deploy-book

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
        
    - name: Install dependencies
      run: |
        pip install -U "jupyter-book<=0.15.1"
        
    - name: Build the book
      run: |
        jupyter-book build docs/jupyter_book
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/jupyter_book/_build/html
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
